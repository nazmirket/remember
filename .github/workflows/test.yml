name: Local memory checks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  coding-agents:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/coding-agents
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/coding-agents/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
  embedded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --all-packages --extra embedded-db --extra test
      - run: PYTHONPATH=embed .venv/bin/python -m pytest embed/tests -q
      - run: .venv/bin/python -m pytest api/tests/test_health_probes.py api/tests/test_migration_shape.py api/tests/test_provider_auth.py api/tests/test_multilingual_bm25.py -q -n 0
  memory-system:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --extra embedded-db
        working-directory: api
      - run: uv sync --frozen
        working-directory: system-tests
      - run: uv run pytest tests -q
        working-directory: system-tests
