name: Local memory checks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  coding-agents:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hindsight-integrations/coding-agents
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hindsight-integrations/coding-agents/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
  embedded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --all-packages --extra embedded-db --extra test
      - run: PYTHONPATH=hindsight-embed .venv/bin/python -m pytest hindsight-embed/tests -q
      - run: .venv/bin/python -m pytest hindsight-api-slim/tests/test_health_probes.py hindsight-api-slim/tests/test_migration_shape.py -q -n 0
  memory-system:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --extra embedded-db
        working-directory: hindsight-api-slim
      - run: uv sync --frozen
        working-directory: hindsight-system-tests
      - run: uv run pytest tests -q
        working-directory: hindsight-system-tests
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path hindsight-cli/Cargo.toml
