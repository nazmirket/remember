[package]
name = "remember-cli"
version = "1.2.1"
edition = "2021"
default-run = "remember"
authors = ["Remember Team"]
description = "Remember local memory command-line interface"
license = "MIT"
repository = "https://github.com/nazmirket/remember"

[[bin]]
name = "remember"
path = "src/main.rs"

[dependencies]
# Remember API client (generated)
remember-client = { path = "client" }

# CLI framework
clap = { version = "4.5", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client (for timeout configuration and multipart file uploads).
reqwest = "0.12"

# Serialization (for config and output formatting)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Colors and styling
colored = "2.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
chrono = "0.4"
dirs = "5.0"

libc = "0.2"

[dev-dependencies]
# For integration tests with blocking HTTP client
reqwest = { version = "0.12", features = ["blocking"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
